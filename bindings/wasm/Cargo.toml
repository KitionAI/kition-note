[package]
name = "kition-note-kit"
description = "The Note engine for Kition's in-page editor: open, edit, and save Markdown notes from JavaScript (WebAssembly), on the Kition SDK."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
kition-kit = { workspace = true }
kition-note-kdm = { workspace = true }
serde_json = { workspace = true }
kition-note-markdown = { workspace = true }
kition-note-edit = { workspace = true }
kition-note-check = { workspace = true }
kition-note-export = { workspace = true }
kition-note-view = { workspace = true }
kition-note-fonts = { workspace = true }
unicode-segmentation = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# The Kition platform convergence suite (L6), on the same kition-sdk revision.
kition-convergence = { workspace = true }
# The declaration comparison (tests/declarations_independent.rs).
regex = { workspace = true }
# The corpus files' pinned hashes (tests/saved.rs, tools/xtask/corpus.json).
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

format: 1
id: note.platform.document-identity/no-replica
feature: note.platform.document-identity
intent: >-
  Through the real kition-note process: the kit serves document.identity, and a .md file (a saved
  note, a byte copy of it, an empty note) carries no document id, because the file is the note's
  text and embeds no replica; document.fork writes the same bytes with no id, leaves the source as
  it was, and never replaces an existing file (file_conflict).
layer: gate

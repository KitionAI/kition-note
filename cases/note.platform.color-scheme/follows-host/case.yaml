intent: >-
  The note follows the host's color scheme, through the development host: opened in dark, the
  engine paints its paper dark (#1e1e1e, Obsidian's dark theme) and the canvas around it is the
  same color, so no white slab sits in a dark shell; switched to light and back without a reload,
  the note repaints each time and no character moves.

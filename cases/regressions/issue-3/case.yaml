format: 1
id: regressions/issue-3
feature: note.properties
intent: >-
  The note's own render (thumbnails, previews, a host without the editor) draws the front matter
  as the properties block (heading, a row per key with its type's icon, its name and its value;
  tags as pills, a checkbox as a box), and tints the text each open comment thread is anchored to
  (not a resolved one's). Once the editor asks for the block (properties.view) it draws it as its
  overlay and the render leaves its room blank. Before, the block was 120 to 210 px of blank space
  and comment threads were not drawn. Mermaid diagrams still draw as code in the render.
layer: gate
source:
  kind: issue
  from: Kition Note regression suite
  license: owned
input: []
steps:
  - cargo-test: { package: kition-note-kit, test: rendered_blocks }
expected:
  - actual: out:exit
    compare: exit

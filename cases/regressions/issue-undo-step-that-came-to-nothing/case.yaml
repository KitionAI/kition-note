format: 1
id: regressions/issue-undo-step-that-came-to-nothing
feature: note.editing
intent: >-
  An undo step whose changes come to nothing (Enter, then Backspace) is, on kition-sdk from
  4b81569, a replica step that changes nothing. The editor skipped it as if the replica kept none,
  so the next Undo undid that empty step instead of the typing before it, and the typing stayed.
  Undo of such a step changes nothing, and the Undo after it takes back the step before.
layer: gate
dimension: function
source:

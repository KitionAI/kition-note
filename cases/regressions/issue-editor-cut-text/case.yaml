id: regressions/issue-editor-cut-text
feature: note.editing
intent: >-
  Cut removed the opener of a span whose closer it cut ('**b** c' from 'b** c' selected) but put
  only the selected text on the clipboard, so a paste did not give back what was cut. The
  clipboard text is now exactly the text removed.

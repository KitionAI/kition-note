format: 1
id: regressions/issue-pasted-web-images
feature: note.images.pasted-addresses
intent: >-
  A picture pasted by its web address (an <img> in HTML copied from a web page) is downloaded
  through the host (Kit UI protocol host/fetchImage) and kept as a new file in the note's
  attachments folder, named by the time it was pasted, and the note links the kept file in place
  of the address; each address is kept once however often the paste repeats it. A picture the host
  refuses stays linked by its address and the person is told. Before, the note kept only the
  address: a document site's signed picture addresses expire within minutes, so the pictures were
  lost.
layer: gate
dimension: data-safety
source:
  kind: issue
  from: owner report (pictures pasted from an online document were not saved and were lost)
  license: owned
input: []
steps:
  - exec: { cmd: [sh, -c, "cd web && npx vitest run src/remoteImages.spec.ts"] }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"

format: 1
id: regressions/issue-block-set-id-line
feature: note.structure
intent: >-
  block.setId by line wrote ' ^id' into front-matter lines, code-block lines and table rows, and
  refused the id the line already had. Those lines are refused as invalid targets now (no Markdown
  block an id can mark), and the line's own id is accepted as no change.

format: 1
id: regressions/issue-coedit-save-merged-twice
feature: note.collab.live
intent: >-
  A co-editor's save of a note this editor already holds, taken in with "Merge its changes" while
  this editor has unsaved edits, brings in nothing twice: the file's merge base takes in other
  people's changes as they arrive, so only what did not come through the room is merged.

format: 1
id: regressions/issue-editor-clear-images
feature: note.format
intent: >-
  Clear formatting removed an image's brackets and parentheses ('![chart](chart.png)' became
  '!chartchart.png') and paired a task box's '[' with a later link's '](' mark. It reads the links from
  the index now: an image or embed stays as it is, a Markdown link loses its brackets and
  parentheses as before (as Obsidian's Clear formatting does), and nothing else is paired.
layer: gate
dimension: function
source:
  kind: probe
  from: bindings/wasm/tests/edit_regressions.rs (clear_formatting_keeps_images)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-note-kit, test: edit_regressions, filter: clear_formatting_keeps_images }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"

format: 1
id: regressions/issue-focus-escape-text-tool
feature: note.platform.display-modes
intent: >-
  Escape leaves Focus when there is nothing to cancel (no text selected, no menu, field or dialog
  open), and with text selected it only clears the selection (KitPointer 4.4). The note's text
  tool takes every editing key, Escape included, so kit-editor saw every Escape as taken and Focus
  could not be left by key (kition-sdk's mode smoke failed "Escape leaves Focus" in all three
  modes).
layer: gate

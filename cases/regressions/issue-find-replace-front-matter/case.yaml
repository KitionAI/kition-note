format: 1
id: regressions/issue-find-replace-front-matter
feature: note.text.edit
intent: >-
  text.find and text.findReplace act on the note's body only: a match inside the front matter is
  neither found, counted nor replaced, so the default first occurrence of "beta" is the prose's,
  not the tags property's, and occurrence "all" leaves the front matter as written. Properties
  change through property.set.
layer: gate
dimension: function
source:
  kind: probe
  from: bindings/wasm/tests/edit_regressions.rs (find_and_replace_skip_the_front_matter)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-note-kit, test: edit_regressions, filter: find_and_replace_skip_the_front_matter }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"

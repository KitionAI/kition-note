format: 1
id: regressions/issue-4
feature: note.tables
intent: >-
  A row inserted into a table that has only its header (table.add {rows: 0}) goes after the
  delimiter row, so the note keeps one well-formed table and later rows and cells address it.
  Before, the row went between the header and the delimiter row and broke the table.

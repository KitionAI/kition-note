format: 1
id: regressions/issue-open-at-line-scroll
feature: note.view
intent: >-
  A note the host opens at a place (document.view: a search hit's line, a heading, a block) shows
  that place: the place is selected only after the first view is placed, so placing the first view
  at the top never scrolls the opened line away again (web/tests/flow.mjs "opening at a line
  selects it and shows it" failed about 1 run in 6).
layer: unit

  from: kition-note web/tests/flow.mjs (line 201 selected, not visible)
  license: Apache-2.0
input: []
steps:
  - exec: { cmd: [sh, -c, "cd web && npx vitest run src/firstView.spec.ts"] }
expected:
  - actual: out:exit
    compare: exit

format: 1
id: regressions/issue-unknown-params
feature: note.agent.recover
intent: >-
  A command with a parameter schema refuses a key the schema does not name and says which, with
  the parameter it resembles and the ones the command takes (platform rule E7a), instead of
  running without it; every key a command reads is in its schema, so a valid call still runs.
  Before, 70 of the 119 schema'd commands ran with an unknown key and 49 refused it without
  naming it, and three schemas left out keys their commands read (selection.set's line, column,
  x and y; text.insert's expected; comment.move's heading and line).
layer: gate
source:
  kind: probe
  from: "unknown-parameter sweep"
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-note-kit, test: unknown_params }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"

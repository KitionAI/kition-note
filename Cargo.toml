[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
exclude = ["vendor"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-note"

[workspace.dependencies]
# internal
kition-note-kdm = { path = "crates/kdm/kdm-model" }
kition-note-markdown-file = { path = "crates/formats/markdown-file" }
kition-note-markdown = { path = "crates/engine/markdown" }
kition-note-edit = { path = "crates/engine/edit" }
kition-note-check = { path = "crates/engine/check" }
kition-note-export = { path = "crates/formats/export" }
kition-note-fonts = { path = "crates/view/fonts" }
kition-note-view = { path = "crates/view/view" }

# Tessera icons (the properties block the view draws), pinned by commit.
kition-tessera-icons = { git = "https://github.com/KitionAI/kition-tessera", rev = "832f61a5e4b4ac1a5083620bfdeeb92a86560694" }
# kition-sdk (public, https://github.com/KitionAI/kition-sdk), pinned by commit: one revision
# for every crate of it.
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835", features = ["session"] }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835" }
# A host of kit processes (`HeadlessKit`), for the `file.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's tests of writes with a basis.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835" }
kition-env = { git = "https://github.com/KitionAI/kition-sdk", rev = "94c488a33b2cabf255c67d2d63167cd85b37c835" }

# Markdown (pulldown-cmark for CommonMark, GFM and wikilinks; saphyr only reads YAML)
pulldown-cmark = { version = "0.13.5", default-features = false }
saphyr = "0.2.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

# view
skrifa = "0.47"
harfrust = "0.13"
kurbo = "0.13"
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
rustc-hash = "2.1"
# latex-rust 2.1.1 (3.x requires Rust 1.99; keep the public SDK buildable on our declared 1.95
# MSRV), with a named-color table of our own in place of its LPPL dvips data file
# (vendor/latex-rust/NOTICE). Its STIX Two Math is the math face.
latex-rust = { path = "vendor/latex-rust", default-features = false, features = ["std"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

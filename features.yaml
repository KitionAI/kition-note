  - id: note.comments.host-anchors
    title: "In a host that keeps comment threads, a selection's Comment starts the host's thread, and its threads are marked on their text"
    dimension: [collab, function]
    priority: P1
    status: has
    paths: [web/src/commentAnchors.ts, web/src/HostComments.tsx, web/src/readOnlySelect.ts, web/src/ai/ReviewBar.tsx, web/src/EditorMenu.tsx, web/src/App.tsx, web/src/main.tsx, web/tests/commentsHost.ts, web/tests/comments.mjs]
    gap: >-
      The host stores an anchor as it was made (the protocol has no anchor update): an open note
      keeps each thread's range on its text through every edit, and a reopened one finds it again
      by its quote, nearest to where it was; a thread whose quoted text was edited before a reopen
      is not marked then (comments/locate answers false). Threads the note kept in its replica
      before are not shown in such a host.
    cases: [note.comments.host-anchors/select-comment-marker-open, regressions/issue-comment-before-keys]
    since: "2026-11-16"
